# Ambiente de PRODUÇÃO — nginx com SSL usando os certificados em .docker/ssl/.
# Uso: docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: app
    image: psi4-app:latest
    container_name: psi4-app
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Workers síncronos e aplicação limitada por I/O: 4 por vCPU (servidor
      # com 2 vCPU / 8 GB; ~100 MB por worker).
      OCTANE_WORKERS: ${OCTANE_WORKERS:-8}
    env_file:
      - .env
    volumes:
      - psi4-public-assets:/var/www/html/public
      - psi4-storage-logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "php", "artisan", "octane:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - psi4

  nginx:
    image: nginx:1.27-alpine
    container_name: psi4-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/ssl:/etc/nginx/ssl:ro
      - psi4-public-assets:/var/www/html/public:ro
    depends_on:
      - app
      - integrations
    restart: unless-stopped
    networks:
      - psi4

  mysql:
    image: mysql:8.4
    container_name: psi4-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - psi4-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - psi4

  redis:
    image: redis:7-alpine
    container_name: psi4-redis
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ]; then redis-server --requirepass "$$REDIS_PASSWORD"; else redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    volumes:
      - psi4-redis-data:/data
    restart: unless-stopped
    networks:
      - psi4

  queue:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: app
    image: psi4-app:latest
    container_name: psi4-queue
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000 --memory=128 --timeout=90
    environment:
      APP_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
    env_file:
      - .env
    volumes:
      - psi4-storage-logs:/var/www/html/storage/logs
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - psi4

  scheduler:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: app
    image: psi4-app:latest
    container_name: psi4-scheduler
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      APP_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
    env_file:
      - .env
    volumes:
      - psi4-storage-logs:/var/www/html/storage/logs
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - psi4

  # API de integrações (Go, ../integrations.local): IA do prontuário em
  # streaming e eventos SSE. Não expõe porta no host: o nginx a publica em
  # int.psi4.com.br. Usa o mysql/redis deste compose (DB_HOST/REDIS_HOST
  # sobrescritos); demais variáveis (DB_NAME, DB_USER, CORS_ORIGINS, OpenAI)
  # vêm do env_file de ../integrations.local. O `make prod` atualiza esse
  # repositório antes do build.
  integrations:
    build:
      context: ../integrations.local
      dockerfile: Dockerfile
    image: psi4-integrations:latest
    container_name: psi4-integrations
    env_file:
      - ../integrations.local/.env
    environment:
      GIN_MODE: release
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # Binário estático sem escrita em disco: filesystem somente leitura.
    read_only: true
    security_opt:
      - no-new-privileges:true
    # O Go espera até 25s os streams em andamento terminarem no deploy.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - psi4

volumes:
  psi4-mysql-data:
  psi4-redis-data:
  psi4-public-assets:
  psi4-storage-logs:

networks:
  psi4:
    driver: bridge
