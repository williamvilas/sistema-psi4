server {
    listen 80;
    listen [::]:80;

    client_max_body_size 2M;
    server_name psi.local *.psi.local localhost;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    charset utf-8;

    location / {
        try_files $uri @octane;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Nenhum .php é servido como arquivo: tudo que não é estático vai ao Octane.
    location ~ \.php$ {
        try_files /not_exists @octane;
    }

    location @octane {
        # Resolve em runtime: se o `app` for recriado (novo IP, ex.: `make
        # clear` após mudar o .env), o nginx acompanha sem precisar de restart.
        resolver 127.0.0.11 valid=10s;
        set $octane_upstream http://app:8000;
        proxy_pass $octane_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não concatena): o Laravel confia neste proxy
        # (trustProxies em bootstrap/app.php) para obter o IP real do cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sobrescreve os demais X-Forwarded-* (o Laravel não confia neles, mas
        # não deixa o valor enviado pelo cliente chegar à aplicação).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Connection "";
        proxy_read_timeout 100s;
        proxy_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
