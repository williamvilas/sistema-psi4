# Host fora do server_name (IP direto, Host forjado): encerra a conexão sem
# resposta, em vez de cair no primeiro bloco e chegar ao Laravel com um Host
# arbitrário (que entraria nos links de e-mail).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# API de integrações (container `integrations`, Go) em int.psi4.com.br. Nome
# exato tem prioridade sobre o wildcard *.psi4.com.br do Laravel abaixo.
server {
    listen 80;
    listen [::]:80;
    server_name int.psi4.com.br;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name int.psi4.com.br;

    ssl_certificate     /etc/nginx/ssl/psi4.com.br.crt;
    ssl_certificate_key /etc/nginx/ssl/psi4.com.br.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Payload é JSON de chat (prompt + histórico).
    client_max_body_size 1M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Resolve em runtime: o nginx sobe mesmo se `integrations` estiver fora.
    resolver 127.0.0.11 valid=10s;
    set $integrations_upstream http://integrations:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Sobrescreve (não concatena) para não repassar IP forjado pelo cliente.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;

    # IA do prontuário: HTML em streaming (chunked). Sem buffer e sem gzip
    # para cada chunk chegar ao navegador assim que o provedor de IA gera.
    location = /medical-records {
        proxy_pass $integrations_upstream;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE: conexão longa com heartbeat a cada 30s.
    location /events/ {
        proxy_pass $integrations_upstream;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass $integrations_upstream;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name psi4.com.br *.psi4.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name psi4.com.br *.psi4.com.br;
    root /var/www/html/public;

    ssl_certificate     /etc/nginx/ssl/psi4.com.br.crt;
    ssl_certificate_key /etc/nginx/ssl/psi4.com.br.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    charset utf-8;

    location / {
        try_files $uri @octane;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Nenhum .php é servido como arquivo: tudo que não é estático vai ao Octane.
    location ~ \.php$ {
        try_files /not_exists @octane;
    }

    location @octane {
        # Resolve em runtime: se o `app` for recriado (novo IP), o nginx
        # acompanha sem precisar de restart.
        resolver 127.0.0.11 valid=10s;
        set $octane_upstream http://app:8000;
        proxy_pass $octane_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não concatena): o Laravel confia neste proxy
        # (trustProxies em bootstrap/app.php) para obter o IP real do cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sobrescreve os demais X-Forwarded-* (o Laravel não confia neles, mas
        # não deixa o valor enviado pelo cliente chegar à aplicação).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Connection "";
        proxy_read_timeout 100s;
        proxy_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
