# Host fora do server_name (IP direto, Host forjado): encerra a conexão sem
# resposta, em vez de cair no primeiro bloco e chegar ao Laravel com um Host
# arbitrário (que entraria nos links de e-mail).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# API de integrações (container `integrations`, Go). Para adicionar outro
# subdomínio, inclua-o no server_name dos dois blocos abaixo (80 e 443).
# Nomes exatos têm prioridade sobre o wildcard *.psi4.com.br do psi.local.
server {
    listen 80;
    listen [::]:80;
    server_name int-stage.psi4.com.br;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name int-stage.psi4.com.br;

    ssl_certificate     /etc/nginx/ssl/psi4.com.br.crt;
    ssl_certificate_key /etc/nginx/ssl/psi4.com.br.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    location / {
        # Resolve em runtime: o nginx sobe mesmo se `integrations` estiver fora.
        resolver 127.0.0.11 valid=10s;
        set $integrations_upstream http://integrations:8080;
        proxy_pass $integrations_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE (/events/:key/:uuid) e HTML em streaming (/medical-records):
        # sem buffer e com timeout longo de leitura.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name *.psi4.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Subdomínio de stage sob psi4.com.br (ex.: stage.psi4.com.br), coberto
    # pelo mesmo certificado wildcard usado em produção.
    server_name *.psi4.com.br;
    root /var/www/html/public;

    ssl_certificate     /etc/nginx/ssl/psi4.com.br.crt;
    ssl_certificate_key /etc/nginx/ssl/psi4.com.br.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    charset utf-8;

    location / {
        try_files $uri @octane;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Nenhum .php é servido como arquivo: tudo que não é estático vai ao Octane.
    location ~ \.php$ {
        try_files /not_exists @octane;
    }

    location @octane {
        # Resolve em runtime: se o `app` for recriado (novo IP), o nginx
        # acompanha sem precisar de restart.
        resolver 127.0.0.11 valid=10s;
        set $octane_upstream http://app:8000;
        proxy_pass $octane_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não concatena): o Laravel confia neste proxy
        # (trustProxies em bootstrap/app.php) para obter o IP real do cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sobrescreve os demais X-Forwarded-* (o Laravel não confia neles, mas
        # não deixa o valor enviado pelo cliente chegar à aplicação).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Connection "";
        proxy_read_timeout 100s;
        proxy_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
