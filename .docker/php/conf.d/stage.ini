; Ambiente de STAGE: opcache habilitado no Octane (CLI), revalidando os
; timestamps dos arquivos (revalidate_freq = 0). Os workers do Octane mantêm o
; código em memória, então o `git pull` só é refletido após o `octane:reload`
; disparado pelo hook .githooks/post-merge (ver .githooks/octane-reload).
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
